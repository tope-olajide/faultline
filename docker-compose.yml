name: faultline

# Faultline local stack.
#
# HydraDB (self-hosted, ELv2) is the authoritative operational knowledge graph.
# It is a real graph-node process: Bolt on 7687, HTTP query API on 8443,
# readiness/metrics on 9090. Storage lives in the `hydradb-store` volume.
#
#   docker compose up -d
#   curl localhost:9090/readyz          # 200 + empty body means ready
#   curl localhost:8443/healthz         # {"status":"ok"}
#
# The bearer token file is generated by `npm run setup` (see scripts/setup.mjs)
# and is never committed.

services:
  hydradb:
    image: ghcr.io/hydra-db/hydradb:latest
    container_name: faultline-hydradb
    user: root
    restart: unless-stopped
    ports:
      - "7687:7687" # Bolt 5.x (Neo4j-compatible driver transport)
      - "8443:8443" # HTTP JSON / NDJSON query API
      - "9090:9090" # /readyz, /metrics
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=0.0.0.0:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_DATA_CACHE_DIR: /cache
      GRAPH_AUTH_TOKEN_FILE: /auth/token
      GRAPH_ALLOW_PLAINTEXT: "true"
      RUST_MIN_STACK: "33554432"
      RUST_LOG: info
    volumes:
      - hydradb-store:/data/store
      - hydradb-cache:/cache
      - ./.hydradb/auth-token:/auth/token:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9090/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  hydradb-store:
  hydradb-cache:
